name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: Bundled library matches lib/
        run: python scripts/vendor_lib.py check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components lib/src scripts

  library:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e './lib[test]'
      - working-directory: lib
        run: pytest --cov=prusa_connect --cov-report=term-missing --cov-fail-under=90
      - name: Build the package
        run: pip install build && python -m build lib
      - name: Build the integration in both release modes
        run: |
          python scripts/vendor_lib.py build --mode bundled --out build/bundled
          python scripts/vendor_lib.py build --mode pypi --out build/pypi
          test -d build/bundled/prusa_connect/_vendor
          test ! -e build/pypi/prusa_connect/_vendor

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      # lib/ is not installed: the tests run on the copy bundled in the integration, as Home Assistant does.
      - run: pip install -r requirements_test.txt
      - run: pytest tests --cov=custom_components --cov-report=term-missing --cov-fail-under=95
